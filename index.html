<style>
:root{--bg:#f4f4f5;--s1:#fff;--s2:#efeff1;--line:#e2e2e6;--ink:#0a0a0b;--mute:#6e6e76;--acc:#0a0a0b;--on:#fff;--glow:rgba(0,0,0,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--s1:#0d0d0f;--s2:#18181b;--line:#27272b;--ink:#f5f5f7;--mute:#8b8b94;--acc:#fff;--on:#000;--glow:rgba(255,255,255,.14)}}
:root[data-theme="dark"]{--bg:#000;--s1:#0d0d0f;--s2:#18181b;--line:#27272b;--ink:#f5f5f7;--mute:#8b8b94;--acc:#fff;--on:#000;--glow:rgba(255,255,255,.14)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;display:flex;justify-content:center;background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif;font-size:16px;-webkit-font-smoothing:antialiased;touch-action:manipulation;transition:background-color .5s,color .3s}
body:not([data-p]){background-image:radial-gradient(110% 55% at 50% -8%,var(--glow),transparent 62%),radial-gradient(90% 40% at 50% 112%,var(--glow),transparent 60%);background-repeat:no-repeat}
body::before{content:"";position:fixed;inset:0;pointer-events:none;opacity:0;transition:opacity .5s}
body[data-p]{--pc:#000;background:var(--pc);color:#fff;-webkit-user-select:none;user-select:none}
body[data-p]::before{opacity:1;background:radial-gradient(circle at 50% 36%,rgba(255,255,255,.24),transparent 58%),radial-gradient(circle at 50% 110%,rgba(255,255,255,.1),transparent 55%)}
body[data-p="rest"]{--pc:#fff;color:#000}
body[data-p="rest"]::before{background:radial-gradient(circle at 50% 36%,rgba(255,255,255,0) 30%,rgba(0,0,0,.12) 100%)}
main{width:100%;max-width:480px;padding:14px 16px 150px;display:flex;flex-direction:column;gap:14px;position:relative}
body[data-p] main{padding-bottom:190px}
p{margin:0}
button{font-family:inherit;cursor:pointer;transition:transform .14s,background .2s,color .2s,opacity .2s}
button:active:not(:disabled){transform:scale(.97)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible{outline:2px solid currentColor;outline-offset:2px}
input{font-family:inherit;color:inherit}
.hide{display:none!important}
#setup{display:flex;flex-direction:column;gap:14px}

/* main tabs and small tabs */
.nav,.seg{position:relative;display:grid;gap:4px;padding:4px;background:var(--s1);border:1px solid var(--line);border-radius:16px}
.nav{grid-template-columns:repeat(3,1fr)}
.seg{grid-template-columns:repeat(2,1fr);width:100%}
.nav::before,.seg::before{content:"";position:absolute;top:4px;bottom:4px;left:4px;border-radius:12px;background:var(--acc);transition:transform .38s cubic-bezier(.3,.9,.3,1)}
.nav::before{width:calc((100% - 16px)/3)}
.seg::before{width:calc((100% - 12px)/2)}
.nav[data-v="J"]::before{transform:translateX(calc(100% + 4px))}
.nav[data-v="T"]::before{transform:translateX(calc(200% + 8px))}
.seg[data-m="sw"]::before{transform:translateX(calc(100% + 4px))}
.nav button,.seg button{position:relative;z-index:1;height:40px;border:0;border-radius:12px;background:transparent;color:var(--mute);font-weight:600;font-size:14px}
.nav button.on,.seg button.on{color:var(--on)}
.seg button:disabled:not(.on){opacity:.35}
.seg button.on:disabled{opacity:1}

/* days */
.dayrow{display:flex;gap:6px}
#gear,#add{width:36px;height:36px;padding:0;justify-content:center;border-radius:50%}
#gear svg,#add svg{width:18px;height:18px}
.days{flex:1;min-width:0;display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dt{height:48px;border-radius:13px;border:1px solid var(--line);background:var(--s1);color:var(--ink);font-weight:600;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:0}
.dt i{width:5px;height:5px;border-radius:50%;background:transparent}
.dt i.has{background:var(--mute)}
.dt.td{background:var(--s2)}
.dt.on,.dt.td.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.dt.on i.has{background:var(--on)}
.gear{width:48px;flex:none;border-radius:13px;border:1px solid var(--line);background:var(--s1);color:var(--ink);display:grid;place-items:center;padding:0}
.gear[aria-expanded="true"]{background:var(--acc);border-color:var(--acc);color:var(--on)}
.dh{display:flex;justify-content:space-between;align-items:center;gap:10px}
h2{margin:0;font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
#sum{margin-top:4px;color:var(--mute);font-size:14px}
.pen{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--s1);color:var(--ink);display:grid;place-items:center;padding:0;flex:none}
.pen.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.sm{height:34px;padding:0 14px;border-radius:17px;border:1px solid var(--line);background:var(--s1);color:var(--ink);font-weight:600;font-size:13px;flex:none}
.sm.on{background:var(--acc);border-color:var(--acc);color:var(--on)}
.sm.sure{background:var(--ink);border-color:var(--ink);color:var(--bg)}
#edbar{display:flex;gap:8px;flex-wrap:wrap}
#cpp{display:flex;flex-direction:column;gap:8px;color:var(--mute);font-size:13px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
#tset .chips{overflow:visible;padding:0}
#tset .chips .sm{flex:1;min-width:0;padding:0}

/* exercise list */
.card,.ex,.vl{background:var(--s1);border:1px solid var(--line);border-radius:18px}
.card{padding:0 14px}
.vl{overflow:hidden}
.vr{display:flex;align-items:center;gap:12px;padding:14px}
.vr+.vr{border-top:1px solid var(--line)}

/* edit card */

.nums{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px}
.num{display:grid;grid-template-columns:36px 1fr 36px;grid-template-areas:"l l l" "m o p";align-items:center;justify-items:center;gap:4px 0}
.num span{grid-area:l;justify-self:start;font-size:12px;color:var(--mute)}
.num button,.mini button{width:36px;height:36px;border-radius:11px;border:1px solid var(--line);background:var(--s2);color:var(--ink);font-size:20px;font-weight:600;padding:0}

.num input,.mini input{border:0;background:transparent;text-align:center;font-family:Outfit,"Inter Tight",sans-serif;font-weight:600;padding:0;height:36px;min-width:0;-moz-appearance:textfield;font-variant-numeric:tabular-nums}

.mini input{width:60px;font-size:24px}

.mini{display:flex;align-items:center;gap:4px}
.mini output{min-width:56px;text-align:center;font-family:Outfit,"Inter Tight",sans-serif;font-size:20px;font-weight:600}

/* settings */

.row b{font-size:15px;font-weight:600}
.sw{width:50px;height:30px;border-radius:15px;border:1px solid var(--line);background:var(--s2);position:relative;flex:none;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--mute);transition:transform .18s}
.sw[aria-checked="true"]{background:var(--acc);border-color:var(--acc)}

/* interval */

/* plain timer */
.tr{position:relative;width:min(76vw,300px);aspect-ratio:1;margin:8px auto}
.tr svg{width:100%;height:100%;transform:rotate(-90deg)}
.tr circle{fill:none;stroke-width:6}

.tt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:Outfit,"Inter Tight",sans-serif;font-weight:600;font-size:64px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}

.lp{display:flex;justify-content:space-between;padding:10px 4px;border-top:1px solid var(--line);font-size:15px;font-variant-numeric:tabular-nums}
.lp span{color:var(--mute)}

/* bottom buttons */

.sb{width:96px;height:58px;flex:none;border-radius:29px;border:1px solid var(--line);background:var(--s1);color:var(--ink);font-size:13px;font-weight:700;letter-spacing:.14em}

/* workout screen */
#run{display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.top{width:100%;display:flex;justify-content:space-between;align-items:center}

#stop.sure{background:#fff;color:#000;border-color:#fff}
#ex{font-size:30px;font-weight:700;letter-spacing:-.01em;line-height:1.1}
#meta,#next{font-size:15px;font-weight:500;opacity:.55;min-height:22px}
.ring{position:relative;width:min(82vw,330px);aspect-ratio:1;margin:6px 0}

body[data-p="rest"] .dots i.d,body[data-p="rest"] .dots i.c{background:#000}

    h=hd(DAYS[D.sel])+'<button class="mr" data-go="copy"'+(Ls.length?'':' disabled')+'><b>Copy to another day</b><small class="hint">Duplicate '+DAYS[D.sel]+' exercises</small></button><button class="mr'+(armed==='clr'?' sure':'')+'" data-go="clr"'+(Ls.length?'':' disabled')+'><b>'+(armed==='clr'?'Sure? Tap again':'Clear '+DAYS[D.sel])+'</b><small class="hint">Remove all exercises for this day</small></button>';
  }else if(sh.t==='copy'){
    h=hd('Duplicate to…')+'<div class="cpg">'+DAYS.map(function(d,i){return i===D.sel?'':'<button class="dc'+(cpSel.indexOf(i)>=0?' on':'')+'" data-cp="'+i+'">'+d+(D.days[i].length?'<small>filled</small>':'')+'</button>'}).join('')+'</div><p class="hint note">Days marked “filled” will be overwritten.</p><button class="big" data-docopy="1"'+(cpSel.length?'':' disabled')+'>DUPLICATE'+(cpSel.length?' TO '+cpSel.length+(cpSel.length>1?' DAYS':' DAY'):'')+'</button>';
  }else{
    h=hd('Settings')+setRows(true)+'<button class="big" data-close="1" style="margin-top:12px">DONE</button>'+'<p class=\"credit\">by wilzsz</p>';
  }
  pn.innerHTML=h;pn.scrollTop=sc;el.classList.remove('hide');document.body.style.overflow='hidden';
}
setInterval(syncDay,30000);setInterval(tick,100);
new MutationObserver(function(){var b=$('big'),n=parseInt(b.textContent),hot='';b.dataset.l=b.textContent.length;try{var ph=document.body.dataset.p;if(n>=1&&n<=3&&(ph==='rest'||ph==='prep'||(ph==='work'&&cur().tw)))hot='1'}catch(e){}$('ring').dataset.hot=hot}).observe($('big'),{childList:true,characterData:true,subtree:true});

/* ===== floating window (Picture-in-Picture) ===== */
var pcv=document.createElement('canvas');pcv.width=640;pcv.height=360;
var pcx=pcv.getContext('2d'),pv=null,pt=null,pon=false,pipSup=false;
try{pipSup=!!pcv.captureStream&&!!pcx&&(function(){var v=document.createElement('video');return !!((v.requestPictureInPicture&&document.pictureInPictureEnabled)||(v.webkitSupportsPresentationMode&&v.webkitSupportsPresentationMode('picture-in-picture')))})()}catch(e){}
function pipBtns(){var a=$('pip'),b=$('tpip');[a,b].forEach(function(x){if(!x)return;x.classList.toggle('hide',!pipSup);x.classList.toggle('on',pon)})}
function pipLeft(){return Math.max(0,S.paused?S.pl:S.end-Date.now())}
function pipData(){
  var o={bg:'#000',fg:'#fff',lab:'',big:'',nm:'',sub:'',fr:1,flash:false};
  if(S.phase!=='setup'){
    var ph=S.phase,e=P.length?cur():null;if(!e)return null;
    var l=pipLeft(),sec=Math.ceil(l/1000);
    if(ph==='prep'){o.lab='GET READY';o.big=''+sec;o.nm=e.n;o.fr=l/S.total}
    else if(ph==='work'){
      o.lab='SET '+S.set+' / '+e.s;o.nm=e.n;
      if(e.man){o.big=''+(e.rep?S.reps:S.set);o.fr=(S.set-1)/e.s;o.sub=e.rep?'reps':'tap when done'}
      else if(e.tw){o.big=''+sec;o.fr=l/S.total;o.sub=e.rep?S.reps+(S.reps===1?' rep':' reps'):(S.paused?'PAUSED':'')}
      else{o.big=''+S.reps;o.fr=Math.min(1,S.reps/e.r);o.sub='of '+e.r+' reps'+(e.w>0?' · '+e.w+' kg':'')}
    }
    else if(ph==='rest'){var nx=nxt();o.bg='#d9dadd';o.fg='#000';o.lab=S.paused?'PAUSED':(S.set>=e.s?'NEXT EXERCISE':'REST');o.big=''+sec;o.fr=l/S.total;o.nm=nx.e.n;o.sub='set '+nx.k+(nx.e.w>0?' · '+nx.e.w+' kg':'')}
    else if(ph==='ready'){var n2=nxt();o.lab='CONTINUE';o.big='GO';o.nm=n2.e.n;o.sub='set '+n2.k;o.flash=true}
    else{o.lab='DONE';o.big=''+S.sets;o.nm=fmt(S.dur);o.sub='sets done'}
    o.fr=Math.max(0,Math.min(1,o.fr));o.dim=!!S.paused;return o;
  }
  if(!(D.view==='T'||T.st!=='idle'))return null;
  var cd=T.m==='cd',st=T.st,v=(st==='run'||st==='pause')?T.cur:(cd&&st!=='fin'?D.cd*1000:0);
  o.big=cd?ft(v):fmt(v);o.fr=Math.max(0,Math.min(1,cd?v/(D.cd*1000):(v%60000)/60000));
  o.nm=cd?'Countdown':'Stopwatch';
  o.lab=st==='run'?(cd?'REMAINING':'ELAPSED'):st==='pause'?'PAUSED':st==='fin'?'TIME’S UP':'READY';
  o.flash=st==='fin';o.dim=st==='pause';
  return o;
}
function pipFit(g,t,w){t=String(t||'');if(g.measureText(t).width<=w)return t;while(t.length>1&&g.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'}
function pipDraw(){
  var d=pipData();if(!d){pipClose();return}
  var g=pcx,W=640,H=360,cx=W/2,cy=H/2,R=150,inv=d.flash&&Math.floor(Date.now()/500)%2===1,bg=inv?d.fg:d.bg,fg=inv?d.bg:d.fg;
  g.globalAlpha=1;g.fillStyle=bg;g.fillRect(0,0,W,H);
  var gr=g.createRadialGradient(cx,cy-30,0,cx,cy,300);gr.addColorStop(0,fg);gr.addColorStop(1,bg);
  g.globalAlpha=.16;g.fillStyle=gr;g.fillRect(0,0,W,H);g.globalAlpha=1;
  g.lineWidth=18;g.lineCap='round';g.strokeStyle=fg;
  g.globalAlpha=.14;g.beginPath();g.arc(cx,cy,R,0,Math.PI*2);g.stroke();g.globalAlpha=d.dim?.45:1;
  if(d.fr>0.002){g.beginPath();g.arc(cx,cy,R,-Math.PI/2,-Math.PI/2+Math.PI*2*d.fr);g.stroke()}
  g.fillStyle=fg;g.textAlign='center';g.textBaseline='middle';
  var sz=230;do{g.font='600 '+sz+'px Outfit,"Inter Tight",sans-serif';sz-=8}while(g.measureText(d.big).width>250&&sz>50);
  g.fillText(d.big,cx,cy+8);g.globalAlpha=1;
}
function pipMH(a,f){try{navigator.mediaSession.setActionHandler(a,f)}catch(e){}}
function pipKeep(){try{if(pv&&pv.paused){var r=pv.play();r&&r.catch&&r.catch(function(){})}}catch(e){}}
function pipState(){
  pon=!!pv&&(document.pictureInPictureElement===pv||pv.webkitPresentationMode==='picture-in-picture');
  if(pon){
    if(!pt)pt=setInterval(pipDraw,250);
    try{if(navigator.mediaSession&&window.MediaMetadata)navigator.mediaSession.metadata=new MediaMetadata({title:'Timer'})}catch(e){}
    
  }else{
    clearInterval(pt);pt=null;
    
    try{pv&&pv.pause()}catch(e){}
  }
  pipBtns();
}
function pipClose(){
  if(!pv||!pon)return;
  try{
    if(document.pictureInPictureElement===pv){var r=document.exitPictureInPicture();r&&r.catch&&r.catch(function(){})}
    else if(pv.webkitSetPresentationMode)pv.webkitSetPresentationMode('inline');
  }catch(e){}
}
function pipToggle(){
  if(pon){pipClose();return}
  try{
    if(!pv){
      pv=document.createElement('video');pv.muted=true;pv.defaultMuted=true;pv.playsInline=true;
      pv.setAttribute('playsinline','');pv.setAttribute('muted','');pv.setAttribute('aria-hidden','true');
      pv.style.cssText='position:fixed;left:0;bottom:0;width:2px;height:2px;opacity:.01;pointer-events:none';
      document.body.appendChild(pv);
      pv.srcObject=pcv.captureStream(10);
      pv.addEventListener('pause',function(){if(pon)pipKeep()});
      pv.addEventListener('enterpictureinpicture',pipState);
      pv.addEventListener('leavepictureinpicture',pipState);
      pv.addEventListener('webkitpresentationmodechanged',pipState);
    }
    pipDraw();
    Promise.resolve(pv.play()).then(function(){
      if(pv.requestPictureInPicture)return pv.requestPictureInPicture();
      pv.webkitSetPresentationMode('picture-in-picture');
    }).then(pipState).catch(function(){toast('Floating window isn’t available here')});
  }catch(e){toast('Floating window isn’t available here')}
}
$('pip').onclick=pipToggle;$('tpip').onclick=pipToggle;pipBtns();
paint();
})();
